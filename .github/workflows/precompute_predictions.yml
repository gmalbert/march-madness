name: Pre-compute Predictions

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM ET, one hour after brackets)
    # NOTE: cron uses UTC; adjust manually if you need to account for DST.
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  precompute:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Add random jitter
        run: |
          delay=$((RANDOM % 600))
          echo "Jitter sleep for ${delay}s"
          sleep $delay
      - name: Print current UTC/ET times
        run: |
          echo "UTC now: $(date -u)"
          echo "ET now: $(TZ=America/New_York date)"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Pre-compute predictions
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/precompute_predictions.py
      
      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data_files/precomputed_predictions/*.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update pre-computed predictions [skip ci]"
          git pull --rebase origin main
          # push with retry/backoff
          for attempt in 1 2 3; do
            git push && break
            echo "push failed (attempt $attempt), retrying in $((attempt*10))s"
            sleep $((attempt * 10))
          done
