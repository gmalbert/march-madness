name: Capture Opening Lines

on:
  schedule:
    # Run three times per day at 11 PM, 7 AM, and 12 PM Eastern.
    # Cron syntax always uses UTC; the values below target EST (UTC−5).
    # During DST the times will shift by one hour (use the comment above
    # to help you pick new UTC values if you need exact ET alignment).
    #
    # ET time → UTC conversion (EST):
    #   11 PM ET → 04 UTC  
    #    7 AM ET → 12 UTC  
    #   12 PM ET → 17 UTC
    - cron: '0 4,12,17 * * *'  # 11 PM/7 AM/12 PM ET (EST utc-5)
  
  workflow_dispatch:  # Allow manual trigger

jobs:
  capture-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 10 was too short for heavy dep installs (pyarrow, scipy, etc.)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Add random jitter
        run: |
          delay=$((RANDOM % 600))
          echo "Jitter delay of ${delay}s"
          sleep $delay
      - name: Print current UTC/ET times
        run: |
          echo "UTC now: $(date -u)"
          echo "ET now: $(TZ=America/New_York date)"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-capture.txt
      
      - name: Run opening line capture
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python -c "
          from auto_capture_opening_lines import OpeningLineCapture
          
          print('Starting opening line capture...')
          capture = OpeningLineCapture()
          capture.capture_new_opening_lines()
          print('Capture complete!')
          "
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data_files/opening_lines.json
          # only stage latest_odds.json if the capture script actually wrote it
          if [ -f data_files/odds_cache/latest_odds.json ]; then
            git add data_files/odds_cache/latest_odds.json
          fi
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update opening lines [skip ci]"
            # sync with remote before pushing
            git pull --rebase origin main || {
              echo "rebase failed, trying merge"
              git rebase --abort
              git pull --no-rebase origin main
            }
            # push with retry/backoff
            for attempt in 1 2 3; do
              git push && break
              echo "push failed (attempt $attempt), retrying in $((attempt*10))s"
              sleep $((attempt * 10))
            done
          fi
